<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seekly PRO Phone Finder</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  margin: 0;
  text-align: center;
}

h1 { color: #38bdf8; margin-top: 20px; }

input, select {
  width: 85%;
  max-width: 500px;
  padding: 12px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  outline: none;
}

button {
  padding: 10px 15px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  background: #38bdf8;
  font-weight: bold;
  cursor: pointer;
}

.card {
  background: #1e293b;
  margin: 10px auto;
  padding: 15px;
  width: 90%;
  max-width: 600px;
  border-radius: 10px;
  text-align: left;
}

.title { color: #38bdf8; }

small { opacity: 0.8; }
</style>
</head>

<body>

<h1>Seekly PRO 📱</h1>

<input id="search" placeholder="Бренд или буква...">

<select id="filter">
  <option value="all">Все</option>
  <option value="budget">Бюджет</option>
  <option value="camera">Камера</option>
  <option value="flagship">Флагман</option>
</select>

<br>

<button onclick="searchPhones()">Поиск</button>
<button onclick="sortCheap()">Самый дешёвый</button>
<button onclick="sortExpensive()">Самый дорогой</button>
<button onclick="sortMid()">Средний</button>
<button onclick="aiHelp()">AI помощник 🤖</button>

<div id="results"></div>

<script>

// 📱 БАЗА (цены добавлены)
const phones = [
  {name:"iPhone 15", brand:"Apple", price:1200, type:"flagship", camera:9},
  {name:"iPhone 13", brand:"Apple", price:700, type:"camera", camera:8},

  {name:"Galaxy S24", brand:"Samsung", price:1100, type:"flagship", camera:9},
  {name:"Galaxy A55", brand:"Samsung", price:350, type:"budget", camera:7},

  {name:"Xiaomi 14", brand:"Xiaomi", price:900, type:"flagship", camera:8},
  {name:"Redmi Note 13", brand:"Xiaomi", price:200, type:"budget", camera:6},

  {name:"HONOR 70", brand:"HONOR", price:400, type:"budget", camera:7}
];

let currentList = phones;

// 🔍 поиск
function searchPhones() {
  let q = document.getElementById("search").value.toLowerCase();
  let f = document.getElementById("filter").value;

  currentList = phones.filter(p =>
    (p.name.toLowerCase().includes(q) ||
     p.brand.toLowerCase().includes(q) ||
     q.length === 1) &&
    (f === "all" || p.type === f)
  );

  show(currentList);
}

// 💰 самый дешёвый
function sortCheap(){
  let sorted = [...currentList].sort((a,b)=>a.price-b.price);
  show(sorted.slice(0,3));
}

// 💰 самый дорогой
function sortExpensive(){
  let sorted = [...currentList].sort((a,b)=>b.price-a.price);
  show(sorted.slice(0,3));
}

// 📊 средний
function sortMid(){
  let sorted = [...currentList].sort((a,b)=>Math.abs(800-a.price)-Math.abs(800-b.price));
  show(sorted.slice(0,3));
}

// 🤖 AI помощник (простая логика)
function aiHelp(){
  let msg = "";

  let cheap = phones.reduce((a,b)=>a.price<b.price?a:b);
  let expensive = phones.reduce((a,b)=>a.price>b.price?a:b);
  let bestCamera = phones.reduce((a,b)=>a.camera>b.camera?a:b);

  msg += "📊 Рекомендации Seekly AI:\\n\\n";
  msg += "💰 Самый дешёвый: " + cheap.name + " ($" + cheap.price + ")\\n";
  msg += "🔥 Самый дорогой: " + expensive.name + " ($" + expensive.price + ")\\n";
  msg += "📸 Лучшая камера: " + bestCamera.name + "\\n";

  alert(msg);
}

// 📦 показать
function show(list){
  let res = document.getElementById("results");
  res.innerHTML = "";

  list.forEach(p=>{
    let div = document.createElement("div");
    div.className="card";

    div.innerHTML = `
      <div class="title">${p.name}</div>
      <small>${p.brand}</small><br><br>
      💰 Цена: $${p.price}<br>
      📸 Камера: ${p.camera}/10<br>
      🏷 Тип: ${p.type}
    `;

    res.appendChild(div);
  });
}

show(phones);

</script>

</body>
</html>
